# ═══════════════════════════════════════════════════════════════════════════
#  Deploy do SendTrace no VPS
#
#  Constrói a imagem AQUI (runner do GitHub) e o VPS só baixa e sobe. Um VPS
#  pequeno compilando a cada push gasta CPU e disco, e o que iria ao ar seria
#  um artefato diferente do que passou pelo CI.
#
#  Roda a cada push na main, ou manualmente pela aba Actions.
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dois deploys ao mesmo tempo no mesmo servidor se atropelam. O novo espera
  # o anterior — não cancela, porque um deploy cortado no meio deixa o VPS
  # num estado indefinido.
  group: deploy-producao
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io
  IMAGEM: ${{ github.repository }}

jobs:
  # ── 1. o código ao menos carrega? ────────────────────────────────────────
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A MESMA versão fixada no Dockerfile e usada em desenvolvimento.
          # Verificar com um Node e rodar com outro deixaria passar sintaxe
          # que só quebra no ar.
          node-version: '24.18.0'
          cache: npm

      - run: npm ci

      # Barreira barata: um erro de sintaxe pararia o painel no ar, e é o tipo
      # de coisa que o `node --check` pega em segundos.
      - name: Sintaxe de todos os módulos
        run: |
          erros=0
          for f in server/*.js api/*.js api/rotas/*.js public/*.js; do
            node --check "$f" || { echo "FALHOU: $f"; erros=1; }
          done
          exit $erros

      # O .env NUNCA pode estar versionado: ele tem a senha do banco.
      - name: O .env vazou para o repositório?
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado. Remova com: git rm --cached .env"
            exit 1
          fi
          echo "ok: .env fora do versionamento"

  # ── 2. imagem ────────────────────────────────────────────────────────────
  construir:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      url_pacote: ${{ steps.meta.outputs.url_pacote }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          # Token que o próprio Actions gera. Não precisa criar segredo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem
        id: meta
        run: |
          # Minúsculas: o Docker recusa maiúsculas no nome da imagem, e nome
          # de usuário/organização no GitHub pode ter.
          nome=$(echo "${{ env.REGISTRO }}/${{ env.IMAGEM }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${nome}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "nome=${nome}" >> "$GITHUB_OUTPUT"

          # Link direto para as configurações do pacote. Sem ele, a mensagem de
          # erro manda "procure em Packages" — e o nome do pacote é o do
          # repositório em MINÚSCULAS, que raramente é o que a pessoa espera
          # ver. A URL muda conforme o dono seja uma conta ou uma organização.
          pacote=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          dono='${{ github.repository_owner }}'
          if [ '${{ github.event.repository.owner.type }}' = 'Organization' ]; then
            base="https://github.com/orgs/${dono}"
          else
            base="https://github.com/users/${dono}"
          fi
          echo "url_pacote=${base}/packages/container/${pacote}/settings" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag pelo commit E `latest`. A do commit é o que permite voltar
          # atrás: `IMAGEM=...:<sha antigo> docker compose up -d`.
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.nome }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. subir no VPS ──────────────────────────────────────────────────────
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment: producao
    steps:
      # O diretório precisa existir ANTES do envio do compose. Falhar aqui com
      # "cd ***: No such file or directory" é ilegível: o GitHub mascara o
      # valor do segredo, então nem dá para ver qual caminho faltou.
      - name: Preparar o diretório no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SENHA }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p '${{ secrets.VPS_CAMINHO }}'
            echo "diretório pronto"

      # O compose vem do repositório a cada deploy: assim o servidor nunca
      # fica com uma versão antiga do arquivo, e é um passo manual a menos.
      - uses: actions/checkout@v4

      - name: Enviar o docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SENHA }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_CAMINHO }}

      - name: Enviar para o VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}

          # Dois caminhos de autenticação. Preencha UM dos dois segredos:
          #
          #   VPS_SSH_KEY  chave privada  — preferível: dá para desligar o
          #                login por senha no servidor, e revogar é apagar
          #                uma linha do authorized_keys.
          #
          #   VPS_SENHA    senha do usuário — mais simples de configurar, mas
          #                obriga o SSH a continuar aceitando senha, então o
          #                servidor segue recebendo tentativas de adivinhação.
          #                Se usar, instale o fail2ban (ver DEPLOY.md).
          #
          # A action usa a chave quando ela existe e cai na senha quando não.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SENHA }}

          script_stop: true
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_CAMINHO }}'

            # O .env é o ÚNICO arquivo que este workflow não pode criar: ele
            # tem a senha do banco e o token do n8n, que não devem sair do
            # servidor. Sem ele o compose falharia com um erro de variável
            # indefinida, longe da causa real.
            if [ ! -f .env ]; then
              echo ""
              echo "════════════════════════════════════════════════════════"
              echo " Falta o arquivo .env no diretório do painel."
              echo ""
              echo " Ele guarda a senha do banco e o token do n8n, então"
              echo " precisa ser criado à mão no servidor — o modelo está na"
              echo " seção 1.5 do DEPLOY.md. No servidor:"
              echo ""
              echo "   cd <VPS_CAMINHO> && nano .env && chmod 600 .env"
              echo ""
              echo " Depois clique em Re-run jobs aqui no Actions."
              echo "════════════════════════════════════════════════════════"
              exit 1
            fi

            # A API sobe junto com o painel e assina os tokens de login com
            # este segredo. Se o .env ainda não o tem, o deploy gera UM e
            # grava — de propósito, uma vez só: gerar a cada deploy invalidaria
            # a sessão de todo mundo em todo push. Ele nasce e morre no
            # servidor; não passa pelo GitHub. (API_URL deixou de ser
            # obrigatória: o padrão é a API deste mesmo compose.)
            if ! grep -qE '^API_JWT_SEGREDO=.' .env; then
              echo "→ .env sem API_JWT_SEGREDO; gerando um agora (só nesta primeira vez)"
              segredo=$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n')
              # Remove uma eventual linha vazia (API_JWT_SEGREDO=) antes de
              # gravar, senão a vazia continuaria valendo para o compose.
              grep -v '^API_JWT_SEGREDO=' .env > .env.novo 2>/dev/null || true
              echo "API_JWT_SEGREDO=$segredo" >> .env.novo
              mv .env.novo .env
              chmod 600 .env
            fi

            # Sem `docker login`: o pacote é público, então o VPS baixa sem
            # credencial nenhuma. Um segredo a menos para guardar e renovar.
            echo "→ baixando ${{ needs.construir.outputs.tag }}"
            export IMAGEM='${{ needs.construir.outputs.tag }}'
            # Grava a tag no .env do servidor: sem isto, um `docker compose up`
            # feito à mão depois voltaria para `latest` e desfaria um rollback.
            grep -v '^IMAGEM=' .env > .env.novo 2>/dev/null || true
            echo "IMAGEM=$IMAGEM" >> .env.novo
            mv .env.novo .env

            # O erro de "não achei a imagem" é o MESMO para pacote privado e
            # para pacote inexistente. Sem esta explicação, o primeiro deploy
            # falha com "denied" e ninguém adivinha que falta um clique na
            # visibilidade do pacote.
            if ! docker compose -f docker-compose.prod.yml pull; then
              echo ""
              echo "════════════════════════════════════════════════════════"
              echo " Não consegui baixar a imagem: o pacote está PRIVADO."
              echo ""
              echo " Abra este link e mude para Public — uma vez só:"
              echo ""
              echo "   ${{ needs.construir.outputs.url_pacote }}"
              echo ""
              echo " Role até Danger Zone → Change visibility → Public."
              echo " Depois clique em Re-run jobs aqui no Actions."
              echo "════════════════════════════════════════════════════════"
              exit 1
            fi

            echo "→ migrações (idempotentes, com trava entre processos)"
            docker compose -f docker-compose.prod.yml run --rm painel npm run setup

            echo "→ subindo"
            docker compose -f docker-compose.prod.yml up -d

            echo "→ esperando ficar saudável"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4300/api/vivo > /dev/null 2>&1; then
                echo "no ar:"
                curl -s http://127.0.0.1:4300/api/vivo
                echo
                docker image prune -f --filter "until=168h" || true
                exit 0
              fi
              sleep 2
            done

            echo "::error::o painel não respondeu em 60s"
            # Os dois serviços: o painel só sobe depois da API ficar saudável,
            # então a causa pode estar no log dela.
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
