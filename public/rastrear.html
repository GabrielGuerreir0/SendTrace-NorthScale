<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Track order · SendTrace</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><path d='M5 21.5 L21.5 7' stroke='%231baf7a' stroke-width='1.7' stroke-linecap='round' opacity='.45'/><circle cx='5' cy='21.5' r='2.1' fill='%231baf7a' opacity='.6'/><circle cx='13.2' cy='14.3' r='3' fill='%231baf7a' opacity='.85'/><circle cx='21.6' cy='7' r='4.3' fill='%234260e6'/></svg>">
</head>
<body class="corpo-login">

<main class="login-palco">

<aside class="login-arte" aria-hidden="true">
  <div class="login-arte-topo">
    <svg class="marca-selo marca-selo--grande" viewBox="0 0 28 28" fill="none">
      <path class="rastro-linha" d="M5 21.5 L21.5 7" stroke-width="1.7" stroke-linecap="round" opacity=".45"/>
      <circle class="rastro-eco" cx="5" cy="21.5" r="2.1" opacity=".6"/>
      <circle class="rastro-eco" cx="13.2" cy="14.3" r="3" opacity=".85"/>
      <circle class="rastro-ponta" cx="21.6" cy="7" r="4.3"/>
    </svg>
    <p class="login-arte-marca">SendTrace</p>
    <span class="marca-by">
      <span>by</span>
      <img src="src/logo_northscale.png" alt="NorthScale" class="marca-by-logo">
    </span>
  </div>

  <div class="login-arte-texto">
    <p class="login-arte-frase" id="t-frase"></p>
    <p class="login-arte-sub" id="t-sub"></p>
  </div>
</aside>

<div class="login-caixa">
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
    <div class="login-marca login-marca--compacta">
      <svg class="marca-selo" viewBox="0 0 28 28" aria-hidden="true" fill="none">
        <path class="rastro-linha" d="M5 21.5 L21.5 7" stroke-width="1.7" stroke-linecap="round" opacity=".45"/>
        <circle class="rastro-eco" cx="5" cy="21.5" r="2.1" opacity=".6"/>
        <circle class="rastro-eco" cx="13.2" cy="14.3" r="3" opacity=".85"/>
        <circle class="rastro-ponta" cx="21.6" cy="7" r="4.3"/>
      </svg>
      <div>
        <div class="marca-titulo">
          <h1 class="marca-nome"><b>SendTrace</b></h1>
          <span class="marca-by">
            <span>by</span>
            <img src="src/logo_northscale.png" alt="NorthScale" class="marca-by-logo">
          </span>
        </div>
        <p class="marca-sub" id="t-marca-sub"></p>
      </div>
    </div>
    <div class="idioma-seletor" id="idioma-seletor"></div>
  </div>

  <!-- ── buscar pelo código do pedido ── -->
  <form class="login-form" id="form-buscar" novalidate>
    <p class="login-tit" id="t-tit"></p>
    <p class="login-nota" id="t-nota"></p>

    <label class="campo campo--bloco">
      <span id="t-label-codigo"></span>
      <input id="r-id" type="text" name="transacao_id" required autofocus
             autocomplete="off" spellcheck="false" placeholder="ex.: X969KZL5">
    </label>

    <p class="login-erro" id="r-erro" role="alert" hidden></p>

    <button class="btn btn-forte" id="r-buscar" type="submit"></button>
  </form>

  <!-- ── resultado ── -->
  <div id="r-resultado" hidden>
    <p class="login-tit" id="r-status-rotulo"></p>
    <p class="login-nota" id="r-produto"></p>

    <div id="r-transportadora" hidden>
      <p class="login-nota" id="r-carrier-linha"></p>
      <p class="login-nota" id="r-tracking-status"></p>
      <a id="r-tracking-url" class="btn btn-forte" href="#" target="_blank" rel="noopener" hidden></a>
    </div>

    <ol id="r-etapas" class="rastreio-etapas"></ol>
    <p class="login-nota" id="r-cancelado" hidden></p>
    <p class="login-nota" id="r-sem-info" hidden></p>

    <button class="btn" id="r-nova-busca" type="button"></button>
  </div>

  <p class="login-rodape">
    <a href="/login" id="t-link-equipe"></a>
  </p>
</div>
</main>

<script type="module" src="rastrear.js"></script>
</body>
</html>
